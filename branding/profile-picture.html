<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1330"/><stop offset=".45" stop-color="#3a2350"/><stop offset=".75" stop-color="#c8603a"/><stop offset="1" stop-color="#f2a24a"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#d39a3c"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".62" r=".5"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
  <clipPath id="archClip"><path id="arch" d="M250 900 V470 Q250 250 540 170 Q830 250 830 470 V900 Z"/></clipPath>
</defs>
<rect x="-100" y="-200" width="1300" height="1500" fill="#1e1226"/>

<!-- arch window -->
<g clip-path="url(#archClip)">
  <rect x="200" y="150" width="680" height="760" fill="url(#sky)"/>
  <rect x="200" y="150" width="680" height="760" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#fff6dd">
    <circle cx="330" cy="330" r="4"/><circle cx="420" cy="270" r="3"/><circle cx="700" cy="300" r="4"/><circle cx="760" cy="390" r="3"/><circle cx="380" cy="420" r="2.5"/><circle cx="650" cy="250" r="2.5"/>
  </g>
  <!-- crescent -->
  <path d="M700 330 a52 52 0 1 0 40 82 a42 42 0 1 1 -40 -82z" fill="url(#gold)"/>
  <!-- skyline silhouette -->
  <g fill="#1b0f18">
    <!-- minaret -->
    <rect x="512" y="330" width="56" height="560"/>
    <rect x="500" y="455" width="80" height="18" rx="4"/>
    <rect x="503" y="575" width="74" height="16" rx="4"/>
    <path d="M518 330 Q540 268 562 330Z"/>
    <rect x="537" y="250" width="6" height="40"/>
    <!-- big dome -->
    <path d="M330 760 Q330 600 445 585 Q560 600 560 760Z"/>
    <rect x="320" y="740" width="250" height="160"/>
    <rect x="442" y="555" width="6" height="34"/>
    <!-- small domes / houses left -->
    <rect x="215" y="700" width="120" height="200"/>
    <path d="M240 700 Q240 650 275 645 Q310 650 310 700Z"/>
    <!-- right houses -->
    <rect x="600" y="690" width="110" height="210"/>
    <rect x="700" y="740" width="140" height="160"/>
    <path d="M720 740 Q720 690 770 684 Q820 690 820 740Z"/>
    <rect x="620" y="660" width="40" height="40"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffc46a">
    <path d="M400 860 v-40 a14 14 0 0 1 28 0 v40z"/><path d="M460 860 v-40 a14 14 0 0 1 28 0 v40z"/>
    <rect x="530" y="500" width="20" height="34" rx="10"/>
    <rect x="245" y="760" width="18" height="26" rx="9"/><rect x="285" y="760" width="18" height="26" rx="9"/>
    <rect x="630" y="740" width="18" height="26" rx="9"/><rect x="670" y="740" width="18" height="26" rx="9"/>
    <rect x="740" y="790" width="18" height="26" rx="9"/><rect x="790" y="790" width="18" height="26" rx="9"/>
  </g>
</g>
<!-- arch frame -->
<path d="M250 900 V470 Q250 250 540 170 Q830 250 830 470 V900" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linejoin="round"/>
<path d="M222 900 V466 Q222 228 540 140 Q858 228 858 466 V900" fill="none" stroke="#d39a3c" stroke-opacity=".55" stroke-width="6"/>
<rect x="200" y="890" width="680" height="26" rx="6" fill="url(#gold)"/>
<!-- name -->
<text id="name" x="540" y="1000" text-anchor="middle" font-family="'Reem Kufi'" font-weight="700" font-size="118" fill="url(#gold)">مدينتنا</text>
</svg>
<script>
const p=new URLSearchParams(location.search);
if(p.has('noname')){document.getElementById('name').remove();
 const s=document.getElementById('s'); s.querySelectorAll('path,rect,g').forEach(()=>{}); s.setAttribute("viewBox","0 -12 1080 1080");}
</script>
</body></html>
